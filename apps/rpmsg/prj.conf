CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

CONFIG_MBOX=y
CONFIG_MBOX_INIT_PRIORITY=40
CONFIG_IPM=y
# Doorbell only: the sample then sends no payload
CONFIG_IPM_MAX_DATA_SIZE=0

CONFIG_OPENAMP=y
CONFIG_OPENAMP_MASTER=n
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
# Linux updates the resource table in this core's cached RAM
CONFIG_OPENAMP_WITH_DCACHE=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
