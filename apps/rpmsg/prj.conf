CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
# Console in the zephyr,ram-console region, published to Linux as a
# remoteproc trace buffer
CONFIG_RAM_CONSOLE=y

CONFIG_MBOX=y
CONFIG_MBOX_INIT_PRIORITY=40
CONFIG_IPM=y
# Doorbell only: the sample then sends no payload
CONFIG_IPM_MAX_DATA_SIZE=0

CONFIG_OPENAMP=y
CONFIG_OPENAMP_MASTER=n
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
# Linux updates the resource table in this core's cached RAM
CONFIG_OPENAMP_WITH_DCACHE=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Zephyr owns core 3 only, Linux runs on cores 0-2
CONFIG_SMP=n
CONFIG_MP_MAX_NUM_CPUS=1
CONFIG_PM_CPU_OPS=n

# Linux sets up the shared GIC distributor
CONFIG_GIC_SAFE_CONFIG=y

# No UART: Linux owns them
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n

# Power domains go through the VideoCore firmware, which Linux owns
CONFIG_POWER_DOMAIN=n
CONFIG_PM_DEVICE=n
CONFIG_PM_DEVICE_POWER_DOMAIN=n

# PCIe hosts the VL805 USB 3 controller, which Linux owns
CONFIG_PCIE=n
