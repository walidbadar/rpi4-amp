# Zephyr owns core 3 only, Linux runs on cores 0-2
CONFIG_SMP=n
CONFIG_MP_MAX_NUM_CPUS=1
CONFIG_PM_CPU_OPS=n

# Linux sets up the shared GIC distributor
CONFIG_GIC_SAFE_CONFIG=y

# No UART: Linux owns them
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n

# Power domains go through the VideoCore firmware, which Linux owns
CONFIG_POWER_DOMAIN=n
CONFIG_PM_DEVICE=n
CONFIG_PM_DEVICE_POWER_DOMAIN=n

# PCIe hosts the VL805 USB 3 controller, which Linux owns
CONFIG_PCIE=n
